["workspace"]
"members" = ["crates/export-protocol", "crates/mail-message", "crates/mail-protocol", "crates/mail-runtime", "crates/object-storage", "crates/plugin-http", "crates/plugin-kit", "crates/plugin-protocol", "crates/plugin-runtime", "crates/repository-protocol"]
"resolver" = "3"

["workspace"."package"]
"version" = "0.1.0"
"edition" = "2024"
"rust-version" = "1.94"
"license" = "AGPL-3.0-only"

["workspace"."dependencies"]
"serde_json" = "1"
"thiserror" = "2"
"axum" = "0.8"
"async-trait" = "0.1"

["workspace"."dependencies"."serde"]
"version" = "1"
"features" = ["derive"]

["workspace"."dependencies"."tokio"]
"version" = "1"
"features" = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "fs"]

["workspace"."dependencies"."url"]
"version" = "2"
"features" = ["serde"]

["workspace"."dependencies"."chrono"]
"version" = "0.4"
"features" = ["serde"]

["workspace"."lints"]

["workspace"."lints"."rust"]
"unsafe_op_in_unsafe_fn" = "deny"
"unused_must_use" = "deny"
"unfulfilled_lint_expectations" = "deny"

["workspace"."lints"."clippy"]
"allow_attributes_without_reason" = "deny"
"as_ptr_cast_mut" = "deny"
"await_holding_lock" = "deny"
"await_holding_refcell_ref" = "deny"
"cast_lossless" = "deny"
"checked_conversions" = "deny"
"dbg_macro" = "deny"
"excessive_nesting" = "deny"
"exit" = "deny"
"fallible_impl_from" = "deny"
"implicit_clone" = "deny"
"let_underscore_future" = "deny"
"lossy_float_literal" = "deny"
"manual_assert" = "deny"
"manual_let_else" = "deny"
"match_wildcard_for_single_variants" = "deny"
"mem_forget" = "deny"
"mut_mut" = "deny"
"needless_continue" = "deny"
"needless_pass_by_ref_mut" = "deny"
"option_option" = "deny"
"rc_mutex" = "deny"
"redundant_else" = "deny"
"ref_option_ref" = "deny"
"todo" = "deny"
"unchecked_time_subtraction" = "deny"
"undocumented_unsafe_blocks" = "deny"
"unimplemented" = "deny"
"unnecessary_box_returns" = "deny"
"unnecessary_safety_comment" = "deny"
"unnecessary_safety_doc" = "deny"
"unnested_or_patterns" = "deny"

["workspace"."lints"."clippy"."correctness"]
"level" = "deny"
"priority" = -1

["workspace"."lints"."clippy"."suspicious"]
"level" = "deny"
"priority" = -1

["workspace"."lints"."clippy"."complexity"]
"level" = "deny"
"priority" = -1

["workspace"."lints"."clippy"."perf"]
"level" = "deny"
"priority" = -1

["workspace"."lints"."clippy"."style"]
"level" = "deny"
"priority" = -1

["profile"]

["profile"."release"]
"lto" = "thin"
"strip" = "debuginfo"
